[project]
name = "telco-churn"
version = "0.1.0"
description = "Tech Challenge Fase 1 (FIAP MLET): predição de churn em telecom com Scikit-Learn"
readme = "README.md"
authors = [
    { name = "Leonardo", email = "leonardo.sapage@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "taskipy>=1.14.1",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.taskipy.tasks]
test = "pytest"
test-cov = "pytest --cov=telco_churn --cov-report=term-missing"